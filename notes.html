<main id="main" class="wrap">
<h1>Learning log</h1>
<p class="muted">Write what you learn. Notes are saved in your own browser, so only you can see them on this device.</p>

<section class="panel" aria-labelledby="form-title">
  <h2 id="form-title">Add a note</h2>
  <form id="note-form" class="form" novalidate>
    <label>Title <input id="note-title" maxlength="80" required></label>
    <label>Topic
      <select id="note-topic">
        <option>Data analysis</option><option>Programming</option><option>Games</option><option>Other</option>
      </select>
    </label>
    <label>Note <textarea id="note-text" rows="4" maxlength="1000" required></textarea></label>
    <div id="form-msg" class="flash" role="status" hidden></div>
    <div class="btn-row">
      <button class="btn" id="note-submit" type="submit">Add note</button>
      <button class="btn ghost" id="note-cancel" type="button" hidden>Cancel editing</button>
    </div>
  </form>
</section>

<section aria-labelledby="list-title">
  <div class="page-head">
    <h2 id="list-title">My notes <span id="note-count" class="muted"></span></h2>
    <button class="btn ghost small" id="note-download" type="button">Download notes (JSON)</button>
  </div>
  <div class="search" role="search">
    <label class="sr" for="note-search">Search notes</label>
    <input id="note-search" type="search" placeholder="Search notes">
    <label class="sr" for="note-filter">Filter by topic</label>
    <select id="note-filter">
      <option value="">All topics</option><option>Data analysis</option><option>Programming</option><option>Games</option><option>Other</option>
    </select>
  </div>
  <div id="note-list" class="cards"></div>
  <div id="note-empty" class="empty" hidden></div>
</section>
</main>
